<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>메일 브리핑</title>
<meta name="apple-mobile-web-app-title" content="메일 브리핑">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;text-align:center;padding:0 24px}
img{width:120px;height:120px;border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
h1{font-size:22px;margin:18px 0 6px}
p{color:#8E8E93;font-size:15px;line-height:1.5;margin:0}
.btn{display:inline-block;margin-top:22px;padding:14px 26px;border-radius:999px;background:#B6F03C;color:#000;font-weight:700;text-decoration:none;font-size:17px}
.steps{margin-top:26px;text-align:left;background:#1C1C1E;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.6;color:#E5E5EA}
.steps b{color:#B6F03C}
</style>
</head>
<body>
<div>
  <img src="apple-touch-icon.png" alt="">
  <h1>메일 브리핑</h1>
  <p id="msg">아래 버튼을 누르면 앱이 열립니다.</p>
  <a class="btn" href="https://claude.ai/artifact/Ux2ndw24Utdi1ezgbFnHuE">앱 열기</a>
  <div class="steps" id="steps">
    <b>홈 화면에 추가하는 법</b><br>
    1. 이 화면에서 Safari 아래 <b>공유</b> 버튼을 누릅니다.<br>
    2. <b>홈 화면에 추가</b>를 선택하고 <b>추가</b>를 누릅니다.<br>
    3. 홈 화면 아이콘을 누르면 바로 앱으로 이동합니다.
  </div>
</div>
<script>
(function(){
  var app="https://claude.ai/artifact/Ux2ndw24Utdi1ezgbFnHuE";
  if(location.hash==="#go"){
    document.getElementById("msg").textContent="메일 브리핑을 여는 중…";
    document.getElementById("steps").style.display="none";
    setTimeout(function(){location.replace(app)},200);
  }else{
    try{history.replaceState(null,"",location.pathname+"#go")}catch(e){}
  }
})();
</script>
</body>
</html>
